server:
  port: 8082

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: governance-service
              uri: lb://governance-service
              predicates:
                - Path=/policies/**
            - id: audit-service
              uri: lb://audit-service
              predicates:
                - Path=/audit-logs/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: localhost