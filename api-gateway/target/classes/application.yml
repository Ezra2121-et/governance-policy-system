server:
  port: 8082

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: governance-service
              uri: lb://governance-service
              predicates:
                - Path=/policies/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: governanceCircuitBreaker
                    fallbackUri: forward:/fallback/governance
            - id: audit-service
              uri: lb://audit-service
              predicates:
                - Path=/audit-logs/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: auditCircuitBreaker
                    fallbackUri: forward:/fallback/audit

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: localhost

resilience4j:
  circuitbreaker:
    instances:
      governanceCircuitBreaker:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      auditCircuitBreaker:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3